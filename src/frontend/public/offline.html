<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#07090d">
    <title>Offline · Axylum Intelligence</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #07090d; color: #e8ebf2; }
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100vh; min-height: 100dvh; margin: 0; place-items: center; padding: 24px; }
      main { width: min(100%, 440px); padding: 28px; border: 1px solid rgba(255,255,255,.1); border-radius: 18px; background: #111620; }
      p { color: #a3abbb; line-height: 1.6; }
      a { display: inline-flex; min-height: 44px; align-items: center; padding: 0 16px; border: 1px solid rgba(91,141,239,.5); border-radius: 10px; background: #315da8; color: white; font: inherit; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <p>AXYLUM INTELLIGENCE</p>
      <h1>You’re offline</h1>
      <p>Market data, account information and trading actions need a connection. Reconnect to continue; no private trading data is stored for offline use.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
